 .cap{font:bold 20px sans-serif;fill:#000;text-anchor:middle}
</style>
<rect width="700" height="820" fill="#fff"/>
<defs><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#000"/></marker></defs>
<text class="cap" x="350" y="36">【도 6】</text>

