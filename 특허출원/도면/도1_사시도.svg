<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<style>
 .l{fill:none;stroke:#000;stroke-width:2}
 .t{fill:none;stroke:#000;stroke-width:1.2}
 .n{font:16px sans-serif;fill:#000}
 .cap{font:bold 20px sans-serif;fill:#000}
 .ld{stroke:#000;stroke-width:1}
</style>
<rect width="600" height="800" fill="#fff"/>
<text class="cap" x="300" y="40" text-anchor="middle">【도 1】</text>

<!-- sphere -->
<circle class="l" cx="300" cy="240" r="150"/>
<!-- polygon cell pattern (approximated truncated icosahedron seams) -->
<polygon class="t" points="300,175 345,205 328,258 272,258 255,205"/>
<path class="t" d="M300,175 L300,105"/>
<path class="t" d="M345,205 L400,175"/>
<path class="t" d="M255,205 L200,175"/>
<path class="t" d="M328,258 L360,320"/>
<path class="t" d="M272,258 L240,320"/>
<path class="t" d="M300,105 L400,175 L430,270 L360,320 L240,320 L170,270 L200,175 Z"/>
<path class="t" d="M300,105 L268,95 M300,105 L332,95"/>
<path class="t" d="M400,175 L425,150 M430,270 L455,262"/>
<path class="t" d="M360,320 L378,362 M240,320 L222,362"/>
<path class="t" d="M170,270 L145,262 M200,175 L175,150"/>
<ellipse class="t" cx="300" cy="240" rx="150" ry="52"/>

<!-- handle -->
<path class="l" d="M262,378 h76 v22 h-76 z"/>
<path class="l" d="M256,400 h88 v150 q0,18 -18,18 h-52 q-18,0 -18,-18 z"/>
<circle class="l" cx="300" cy="432" r="16"/>
<rect class="t" x="278" y="470" width="44" height="52" rx="6"/>
<path class="l" d="M264,568 h72 v22 q0,10 -12,10 h-48 q-12,0 -12,-10 z"/>
<rect class="t" x="288" y="586" width="24" height="7" rx="3.5"/>

<!-- strap -->
<path class="t" d="M344,470 q42,40 34,96 q-4,26 -22,30"/>
<path class="t" d="M352,468 q44,42 36,100 q-5,28 -24,32"/>

<!-- leaders -->
<line class="ld" x1="430" y1="150" x2="500" y2="120"/><text class="n" x="506" y="124">110</text>
<line class="ld" x1="300" y1="220" x2="500" y2="196"/><text class="n" x="506" y="200">111</text>
<line class="ld" x1="345" y1="205" x2="500" y2="242"/><text class="n" x="506" y="246">112</text>
<line class="ld" x1="316" y1="432" x2="440" y2="418"/><text class="n" x="446" y="422">230</text>
<line class="ld" x1="256" y1="480" x2="150" y2="470"/><text class="n" x="118" y="474">200</text>
<line class="ld" x1="278" y1="500" x2="150" y2="530"/><text class="n" x="118" y="534">250</text>
<line class="ld" x1="378" y1="566" x2="450" y2="586"/><text class="n" x="456" y="590">240</text>
<line class="ld" x1="300" y1="590" x2="200" y2="640"/><text class="n" x="160" y="644">172</text>
<line class="ld" x1="380" y1="300" x2="470" y2="330"/><text class="n" x="476" y="334">100</text>
</svg>
