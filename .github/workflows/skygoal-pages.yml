name: SKY GOAL — 웹앱 배포 (GitHub Pages)

# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 두면
# 이 브랜치에 푸시할 때마다 자동으로 배포된다.
#
# (수동 실행 버튼은 워크플로 파일이 '기본 브랜치'에 있을 때만 나타난다.
#  이 저장소의 기본 브랜치는 india-2030 쪽이라 push 트리거를 쓴다.)
on:
  push:
    branches: [claude/sky-goal-setup-ncjovt]
    paths:
      - 'SKY_GOAL_2_0/**'
      - '.github/workflows/skygoal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 설치형 웹앱(PWA) 빌드
        run: python3 build.py --pwa
        working-directory: SKY_GOAL_2_0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: SKY_GOAL_2_0/07_MVP_Code/pwa
      - id: deployment
        uses: actions/deploy-pages@v4
