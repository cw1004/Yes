# 하나의 길 — ONE WAY  ·  nginx
#
# 아래 example.kr 을 실제 도메인으로 모두 바꾸십시오.
#   sed -i 's/example.kr/내도메인.kr/g' deploy/nginx/oneway.conf

# ── 요청 제한 ────────────────────────────────────────────────
# 상담 한 번이 Claude API 한 번이고, 그건 돈입니다.
# 앱에서도 막지만(oneway/web/ratelimit.py) 여기서 먼저 걸러 냅니다.
limit_req_zone $binary_remote_addr zone=counsel:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;

upstream oneway_app {
    server app:8000;
    keepalive 16;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.kr www.example.kr;

    # 인증서 발급·갱신용 경로만 열어 둡니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://example.kr$request_uri;
    }
}

# ── www 를 뺀 주소로 통일 (검색엔진이 한 주소만 보게) ─────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.kr;

    ssl_certificate     /etc/letsencrypt/live/example.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.kr/privkey.pem;

    return 301 https://example.kr$request_uri;
}

# ── 본체 ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.kr;

    ssl_certificate     /etc/letsencrypt/live/example.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 보안 헤더 ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP — style-src 와 script-src 에 'unsafe-inline' 이 들어간 이유:
    #   · 진행 막대 폭 같은 inline style 속성을 씁니다
    #   · 구조화 데이터(JSON-LD)가 <script> 태그로 들어갑니다
    #   · 애널리틱스 스니펫도 inline 입니다
    # 이 사이트는 방문자가 쓴 글을 다른 사람에게 보여 주지 않고(기도 지향은
    # 본인에게만), 모든 출력이 escape 되므로 XSS 위험은 낮습니다.
    # 더 조이려면 JSON-LD 를 없애고 nonce 방식으로 바꾸면 됩니다.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 128k;      # 이 사이트는 파일을 받지 않습니다
    limit_conn conns 20;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 512;

    # ── 상담 API — 가장 아껴야 하는 곳 ───────────────────────
    location /api/counsel {
        limit_req zone=counsel burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://oneway_app;
        include /etc/nginx/conf.d/oneway_proxy.inc;
        proxy_read_timeout 120s;    # Claude 응답이 길어질 수 있습니다
    }

    # ── 맞춤 책 생성 ─────────────────────────────────────────
    location ~ ^/my-book\.(epub|html)$ {
        limit_req zone=counsel burst=5 nodelay;
        proxy_pass http://oneway_app;
        include /etc/nginx/conf.d/oneway_proxy.inc;
        proxy_read_timeout 60s;
    }

    # ── 정적 파일 ────────────────────────────────────────────
    location /static/ {
        proxy_pass http://oneway_app;
        include /etc/nginx/conf.d/oneway_proxy.inc;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /healthz {
        access_log off;
        proxy_pass http://oneway_app;
        include /etc/nginx/conf.d/oneway_proxy.inc;
    }

    # ── 나머지 ───────────────────────────────────────────────
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://oneway_app;
        include /etc/nginx/conf.d/oneway_proxy.inc;
    }
}
