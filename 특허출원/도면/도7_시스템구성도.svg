20" y="566" width="106" height="66"/><text class="ncs" x="773.0" y="596">연출</text><text class="ncs" x="773.0" y="616">식별자</text><rect class="o" x="826" y="566" width="120" height="66"/><text class="ncs" x="886.0" y="596">개시 시각</text><text class="ncs" x="886.0" y="616">정보</text><rect class="o" x="946" y="566" width="222" height="66"/><text class="ncs" x="1057.0" y="596">좌표별 출력값</text><text class="ncs" x="1057.0" y="616">또는 산출 규칙</text><text class="note" x="600" y="666">· 접속 수립을 요하지 아니하므로 동시 수용 대수에 원리적 제한이 없다.</text><text class="note" x="600" y="694">· 좌표별 출력값 대신 산출 규칙(전파 방향 · 속도 · 색상 변화 계수)을</text><text class="note" x="600" y="718">　전송하면, 패킷 크기가 장치 대수와 무관하게 유지된다.</text><text class="note" x="600" y="752">· 소정 시간 이상 미수신 시 : 최종 연출 유지 또는</text><text class="note" x="600" y="776">　내부 이벤트 판별 결과에 따른 출력으로 자동 복귀한다.</text></svg>