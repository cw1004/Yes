"/><circle cx="952" cy="316" r="2.5" fill="#000"/><text class="n" x="1020" y="265" text-anchor="start">117</text><line class="ld" x1="932" y1="358" x2="1012" y2="300"/><circle cx="932" cy="358" r="2.5" fill="#000"/><text class="n" x="1020" y="305" text-anchor="start">220</text><line class="ld" x1="790" y1="398" x2="1012" y2="380"/><circle cx="790" cy="398" r="2.5" fill="#000"/><text class="n" x="1020" y="385" text-anchor="start">210</text><line class="o" x1="150" y1="682" x2="550" y2="682"/><line class="o" x1="150" y1="682" x2="150" y2="530"/><text class="ns" x="550" y="706" text-anchor="end">결합부 이격 거리</text><text class="ns" x="154" y="520">홀 센서(145) 출력</text><polyline class="o" points="150.0,544.0 160.0,555.2 170.0,565.6 180.0,575.1 190.0,583.8 200.0,591.8 210.0,599.1 220.0,605.9 230.0,612.1 240.0,617.8 250.0,623.0 260.0,627.8 270.0,632.2 280.0,636.3 290.0,640.0 300.0,643.4 310.0,646.6 320.0,649.5 330.0,652.1 340.0,654.6 350.0,656.8 360.0,658.8 370.0,660.7 380.0,662.5 390.0,664.1 400.0,665.5 410.0,666.9 420.0,668.1 430.0,669.2 440.0,670.3 450.0,671.2 460.0,672.1 470.0,672.9 480.0,673.7 490.0,674.3 500.0,675.0 510.0,675.5 520.0,676.1 530.0,676.5 540.0,677.0 550.0,677.4"/><line class="hd" x1="150" y1="648.9" x2="550" y2="648.9"/><text class="ns" x="558" y="653.9">문턱값</text><line class="hd" x1="318.0" y1="530" x2="318.0" y2="682"/><text class="ncs" x="234.0" y="730">결합 판별</text><text class="ncs" x="434.0" y="730">분리 판별</text><text class="ncs" x="234.0" y="752">통상 발광 모드</text><text class="ncs" x="434.0" y="752">저전력 표시 모드</text><text class="note" x="620" y="536">(a) 자성체(221)의 자속이 홀 센서(145)에 도달하여</text><text class="note" x="620" y="562">　　출력 ≥ 문턱값 → 제어부(130)가 결합 상태로 판별</text><text class="note" x="620" y="588">　　→ 통상 발광 모드</text><text class="note" x="620" y="626">(b) 이격에 따라 자속 밀도가 감소하여</text><text class="note" x="620" y="652">　　출력 &lt; 문턱값 → 분리 상태로 판별</text><text class="note" x="620" y="678">　　→ 구동 전류를 제한하고, 밝기 변화 주기가 긴</text><text class="note" x="620" y="704">　　　패턴으로 전환 (저전력 표시 모드)</text><text class="note" x="620" y="742">전기 접점(222)은 탄성 부재(223)에 의하여 변위 가능하고,</text><text class="note" x="620" y="768">방향 결정 형상(117)에 의해 정해진 방향으로만 결합된다.</text></svg>