[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kis-trader"
version = "0.1.0"
description = "한국투자증권 KIS Open API 기반 개인 주식 자동매매 시스템"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
    "pycryptodome>=3.20,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
web = ["flask>=3.0,<4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "responses>=0.25", "ruff>=0.5", "flask>=3.0,<4"]

[project.scripts]
kis = "kis.cli:main"

[tool.setuptools.packages.find]
include = ["kis*"]

[tool.setuptools.package-data]
"kis.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 한글 주석은 문자 폭이 2로 계산되어 E501 이 과하게 잡힌다. 훅 메서드는 추상화 대상이 아니다.
ignore = ["B008", "B027"]
