name: SKY GOAL — 테스트 & 안드로이드 빌드

on:
  push:
    branches: ['**']
    paths:
      - 'SKY_GOAL_2_0/**'
      - '.github/workflows/skygoal-android.yml'
  pull_request:
    paths:
      - 'SKY_GOAL_2_0/**'
  workflow_dispatch:

jobs:
  test:
    name: 단위 테스트 + 브라우저 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 웹 게임 빌드
        run: python3 build.py --pwa
        working-directory: SKY_GOAL_2_0
      - name: 단위 테스트 (엔진 · 사운드 · 배경)
        run: node --test 07_MVP_Code/tests/engine.test.js 07_MVP_Code/tests/audio.test.js 07_MVP_Code/tests/scenery.test.js
        working-directory: SKY_GOAL_2_0
      - name: Playwright 설치
        run: |
          npm i -g playwright
          playwright install --with-deps chromium
      - name: 브라우저 스모크 테스트
        run: node 07_MVP_Code/tests/browser.smoke.mjs
        working-directory: SKY_GOAL_2_0
        env:
          NODE_PATH: /usr/local/lib/node_modules

  android:
    name: 안드로이드 APK / AAB
    runs-on: ubuntu-latest
    needs: test
    # secrets 컨텍스트는 step 의 if 에서 못 쓰므로 잡 레벨 env 로 옮긴다
    env:
      KEYSTORE_B64: ${{ secrets.SKYGOAL_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 게임 · 아이콘 동기화
        run: ./sync_assets.sh
        working-directory: SKY_GOAL_2_0/11_App_Android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 업로드 키 준비 (시크릿이 있을 때만 서명한다)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: 빌드
        run: gradle assembleDebug bundleRelease --no-daemon --stacktrace
        working-directory: SKY_GOAL_2_0/11_App_Android
        env:
          SKYGOAL_KEYSTORE: ${{ env.KEYSTORE_B64 != '' && format('{0}/upload.jks', runner.temp) || '' }}
          SKYGOAL_KEYSTORE_PASSWORD: ${{ secrets.SKYGOAL_KEYSTORE_PASSWORD }}
          SKYGOAL_KEY_ALIAS: ${{ secrets.SKYGOAL_KEY_ALIAS }}
          SKYGOAL_KEY_PASSWORD: ${{ secrets.SKYGOAL_KEY_PASSWORD }}
      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: skygoal-android
          path: |
            SKY_GOAL_2_0/11_App_Android/app/build/outputs/apk/debug/*.apk
            SKY_GOAL_2_0/11_App_Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
