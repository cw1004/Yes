</style>
<defs>
 <marker id="ar" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
  <path d="M0,0 L8.5,3 L0,6 z" fill="#000"/></marker>
 <pattern id="hA" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern>
 <pattern id="hB" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern>
 <pattern id="hC" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="1.6"/></pattern>
 <pattern id="hD" width="6" height="6" patternUnits="userSpaceOnUse">
  <circle cx="3" cy="3" r="1.0" fill="#000"/></pattern>
</defs>
<rect width="1220" height="940" style="fill:#fff"/><text class="cap" x="610.0" y="40">【도 8】</text><text class="sub" x="30" y="72">시각 동기 및 좌표별 출력값 추출 타이밍도</text><line class="o" x1="240" y1="160" x2="1150" y2="160" marker-end="url(#ar)"/><text class="ns" x="226" y="165" text-anchor="end">송출부 500</text><rect class="m" x="300" y="132" width="46" height="28"/><text class="ncs" x="323" y="151">P1</text><line class="hd" x1="323" y1="160" x2="323" y2="600"/><rect class="m" x="440" y="132" width="46" height="28"/><text class="ncs" x="463" y="151">P2</text><line class="hd" x1="463" y1="160" x2="463" y2="600"/><rect class="m" x="580" y="132" width="46" height="28"/><text class="ncs" x="603" y="151">P3</text><line class="hd" x1="603" y1="160" x2="603" y2="600"/><rect class="m" x="720" y="132" width="46" height="28"/><text class="ncs" x="743" y="151">P4</text><line class="hd" x1="743" y1="160" x2="743" y2="600"/><text class="ns" x="1150" y="96" text-anchor="end">P : 기준 시각 · 연출 식별자 · 개시 시각 · 좌표별 출력값(또는 산출 규칙)</text><line class="o" x1="240" y1="300" x2="1150" y2="300" marker-end="url(#ar)"/><text class="ns" x="226" y="305" text-anchor="end">장치 A (100a)</text><path class="m" d="M333,300 v-22 h9 v22"/><path class="ar2" d="M323,288 H331"/><path class="m" d="M473,300 v-22 h9 v22"/><path class="ar2" d="M463,288 H471"/><path class="m" d="M613,300 v-22 h9 v22"/><path class="ar2" d="M603,288 H611"/><path class="m" d="M753,300 v-22 h9 v22"/><path class="ar2" d="M743,288 H751"/><text class="ns" x="340" y="276">Δ1</text><line class="o" x1="240" y1="420" x2="1150" y2="420" marker-end="url(#ar)"/><text class="ns" x="226" y="425" text-anchor="end">장치 B (100b)</text><path class="m" d="M353,420 v-22 h9 v22"/><path class="ar2" d="M323,408 H351"/><path class="m" d="M493,420 v-22 h9 v22"/><path class="ar2" d="M463,408 H491"/><path class="m" d="M633,420 v-22 h9 v22"/><path class="ar2" d="M603,408 H631"/><path class="m" d="M773,420 v-22 h9 v22"/><path class="ar2" d="M743,408 H771"/><text class="ns" x="354" y="396">Δ2</text><text class="ns" x="240" y="372">수신 시점은 장치마다 상이</text><line class="o" x1="240" y1="600" x2="1150" y2="600"/><line class="o" x1="240" y1="600" x2="240" y2="470"/><text class="ns" x="226" y="476" text-anchor="end">시각 오차</text><text class="ns" x="226" y="605" text-anchor="end">0</text><path class="o" d="M240,482 L323,476 M323,476 L323,496 M323,496 L463,490 M463,490 L463,538 M463,538 L603,532 M603,532 L603,566 M603,566 L743,560 M743,560 L743,584 M743,584 L1130,580"/><text class="ncs" x="378" y="468">S220 · S230 보정</text><circle cx="463" cy="538" r="3.5" fill="#000"/><circle cx="603" cy="566" r="3.5" fill="#000"/><circle cx="743" cy="584" r="3.5" fill="#000"/><text class="ns" x="1150" y="484" text-anchor="end">주파수 편차 보정(S230)에 의하여</text><text class="ns" x="1150" y="504" text-anchor="end">패킷 사이 구간의 오차 누적도 억제된다</text><line class="ct" x1="880" y1="100" x2="880" y2="900"/><text class="n" x="890" y="196">개시 시각 T0</text><line class="o" x1="240" y1="760" x2="1150" y2="760"/><text class="ns" x="226" y="765" text-anchor="end">A 발광 출력</text><path class="o" d="M880,760 v-44 h122 v44 h44 v-44 h74 v44"/><line class="o" x1="240" y1="860" x2="1150" y2="860"/><text class="ns" x="226" y="865" text-anchor="end">B 발광 출력</text><path class="o" d="M880,860 v-44 h122 v44 h44 v-44 h74 v44"/><path class="ar2" d="M790,700 H876"/><text class="ns" x="784" y="704" text-anchor="end">S250 출력 개시</text><text class="note" x="240" y="912">수신 시점(Δ1 ≠ Δ2)이 서로 달라도, 정렬된 내부 클럭에 의하여 출력 개시 시각은 T0 로 일치한다 (편차 수 ms 이내).</text><text class="note" x="240" y="666">S210 수신 → S220 오프셋 · 주파수 편차 산출 → S230 내부 클럭 정렬 → S240 좌표 식별자별 출력값 추출/산출 → S250 개시 시각에 출력</text></svg>