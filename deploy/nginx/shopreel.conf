# SHOPREEL — nginx 리버스 프록시 설정
#
#   1) /etc/nginx/sites-available/shopreel.conf 로 복사하고 server_name 을 바꾼다
#   2) ln -s /etc/nginx/sites-available/shopreel.conf /etc/nginx/sites-enabled/
#   3) nginx -t && systemctl reload nginx
#   4) certbot --nginx -d link.내도메인.com     ← HTTPS 인증서 발급(80 블록을 자동 수정)
#
# 영상·이미지는 파이썬을 거치지 않고 nginx 가 직접 내보낸다(Range 지원 · 훨씬 빠름).
# 그 외 경로만 추적 서버로 넘긴다.

# 전환 웹훅 남용 방지 (제휴 네트워크는 초당 몇 건이면 충분하다)
limit_req_zone $binary_remote_addr zone=shopreel_postback:1m rate=10r/s;

upstream shopreel_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name link.example.com;          # ← 실제 도메인으로 바꾸세요

    # certbot 이 이 블록을 HTTPS 리다이렉트로 바꿔 준다
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name link.example.com;          # ← 실제 도메인으로 바꾸세요

    # certbot 이 아래 4줄을 채워 준다
    # ssl_certificate     /etc/letsencrypt/live/link.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/link.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 상품 이미지·영상이 있는 곳 (shopreel 의 out_dir/video)
    set $shopreel_media /var/lib/shopreel/video;

    access_log /var/log/nginx/shopreel.access.log;
    error_log  /var/log/nginx/shopreel.error.log;

    client_max_body_size 1m;               # 웹훅 JSON 말고는 받을 게 없다
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/html text/css application/json;
    gzip_min_length 512;

    # ── 상품 이미지 ────────────────────────────────────────────────
    # 자막이 없는 상품 원본 사진(<key>_photo.jpg)을 먼저 찾고, 없으면 영상 썸네일
    location ~ ^/img/(?<media_key>[A-Za-z0-9_-]+)\.jpg$ {
        alias $shopreel_media/;
        try_files "${media_key}_photo.jpg" "${media_key}.jpg" =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── 영상 파일 (인스타그램 Graph API 가 받아 간다) ───────────────
    location ~ ^/v/(?<video_key>[A-Za-z0-9_-]+)\.mp4$ {
        alias $shopreel_media/;
        try_files "${video_key}.mp4" =404;
        types { }
        default_type video/mp4;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
    }

    # ── 전환 웹훅 ─────────────────────────────────────────────────
    location = /postback {
        limit_req zone=shopreel_postback burst=20 nodelay;
        proxy_pass http://shopreel_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 링크인바이오 · 클릭 리다이렉트 · 통계 ───────────────────────
    location / {
        proxy_pass http://shopreel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 통계는 외부에 열지 않는다 (필요하면 IP 를 허용 목록에 추가)
    location = /stats {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://shopreel_app;
        include /etc/nginx/proxy_params;
    }
}
