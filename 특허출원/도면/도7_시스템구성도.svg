<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<style>
 .b{fill:none;stroke:#000;stroke-width:2}
 .t{fill:none;stroke:#000;stroke-width:1.2}
 .a{fill:none;stroke:#000;stroke-width:1.4}
 .w{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:6 5}
 .tx{font:15px sans-serif;fill:#000;text-anchor:middle}
 .s{font:13px sans-serif;fill:#000;text-anchor:middle}
 .n{font:15px sans-serif;fill:#000}
 .cap{font:bold 20px sans-serif;fill:#000;text-anchor:middle}
</style>
<rect width="900" height="650" fill="#fff"/>
<defs><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#000"/></marker></defs>
<text class="cap" x="450" y="36">【도 7】</text>

<!-- server -->
<rect class="b" x="40" y="90" width="200" height="150"/>
<text class="tx" x="140" y="118">서버 (400)</text>
<rect class="t" x="60" y="134" width="160" height="40"/>
<text class="s" x="140" y="150">연출 스케줄러</text><text class="s" x="140" y="167">(410)</text>
<rect class="t" x="60" y="184" width="160" height="42"/>
<text class="s" x="140" y="200">좌표 매핑 DB</text><text class="s" x="140" y="217">(420)</text>

<line class="a" x1="240" y1="165" x2="320" y2="165" marker-end="url(#a4)"/>
<text class="s" x="280" y="152">연출데이터</text>

<!-- transmitters -->
<rect class="b" x="320" y="120" width="150" height="90"/>
<text class="tx" x="395" y="152">송출부 (500)</text>
<text class="s" x="395" y="176">분산 배치 송출기</text>
<text class="s" x="395" y="194">송출 시각 정렬</text>

<!-- broadcast waves -->
<g class="w">
<path d="M470,165 q60,-40 130,0"/>
<path d="M470,165 q70,20 140,60"/>
<path d="M470,165 q80,60 150,140"/>
</g>
<text class="s" x="600" y="128">브로드캐스트 (비접속형, 단방향)</text>

<!-- stands grid = devices -->
<rect class="b" x="470" y="230" width="390" height="230"/>
<text class="s" x="665" y="250">관람 공간 = 대면적 표시 영역</text>
<g class="t">
<circle cx="510" cy="286" r="11"/><circle cx="556" cy="286" r="11"/><circle cx="602" cy="286" r="11"/>
<circle cx="648" cy="286" r="11"/><circle cx="694" cy="286" r="11"/><circle cx="740" cy="286" r="11"/><circle cx="786" cy="286" r="11"/><circle cx="826" cy="286" r="11"/>
<circle cx="510" cy="332" r="11"/><circle cx="556" cy="332" r="11"/><circle cx="602" cy="332" r="11"/>
<circle cx="648" cy="332" r="11"/><circle cx="694" cy="332" r="11"/><circle cx="740" cy="332" r="11"/><circle cx="786" cy="332" r="11"/><circle cx="826" cy="332" r="11"/>
<circle cx="510" cy="378" r="11"/><circle cx="556" cy="378" r="11"/><circle cx="602" cy="378" r="11"/>
<circle cx="648" cy="378" r="11"/><circle cx="694" cy="378" r="11"/><circle cx="740" cy="378" r="11"/><circle cx="786" cy="378" r="11"/><circle cx="826" cy="378" r="11"/>
<circle cx="510" cy="424" r="11"/><circle cx="556" cy="424" r="11"/><circle cx="602" cy="424" r="11"/>
<circle cx="648" cy="424" r="11"/><circle cx="694" cy="424" r="11"/><circle cx="740" cy="424" r="11"/><circle cx="786" cy="424" r="11"/><circle cx="826" cy="424" r="11"/>
</g>
<g fill="#000">
<circle cx="602" cy="332" r="11"/><circle cx="648" cy="332" r="11"/><circle cx="694" cy="332" r="11"/>
<circle cx="648" cy="286" r="11"/><circle cx="648" cy="378" r="11"/>
</g>
<text class="s" x="500" y="270">(x,y)</text>

<!-- single device detail -->
<circle class="b" cx="180" cy="400" r="52"/>
<path class="b" d="M164,450 h32 v70 q0,10 -10,10 h-12 q-10,0 -10,-10 z"/>
<text class="s" x="180" y="404">100</text>
<text class="s" x="180" y="556">좌표 식별자 할당</text>
<line class="a" x1="470" y1="380" x2="240" y2="400" marker-end="url(#a4)"/>

<!-- user terminal -->
<rect class="b" x="300" y="470" width="90" height="140" rx="10"/>
<rect class="t" x="312" y="492" width="66" height="96"/>
<text class="s" x="345" y="632">300 / 310</text>
<line class="a" x1="300" y1="530" x2="242" y2="500" marker-end="url(#a4)"/>
<text class="s" x="272" y="484">BLE</text>

<text class="s" x="665" y="490">각 장치 = 1 화소 (좌표 식별자 → 출력값)</text>
<text class="s" x="665" y="512">기준 시각 정보로 내부 클럭 정렬 → 개시 시각에 동시 발광</text>
</svg>
