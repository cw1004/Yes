name: 세 친구의 여행 — 테스트

on:
  push:
    branches: ['**']
    paths:
      - 'THREE_FRIENDS/**'
      - 'IP_BIBLE/**'
      - '.github/workflows/threefriends.yml'
  pull_request:
    paths:
      - 'THREE_FRIENDS/**'
      - 'IP_BIBLE/**'
  workflow_dispatch:

jobs:
  test:
    name: 엔진 · 바이블 정합성 · 브라우저 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright 설치
        run: |
          npm i -g playwright
          playwright install --with-deps chromium
          # setup-node 를 쓰면 전역 모듈 경로가 /usr/local 이 아니다.
          # 고정값을 적어 두면 require 가 실패하고 테스트가 조용히 건너뛰어진다.
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          echo "전역 모듈 경로: $(npm root -g)"
      - name: 전체 검증
        run: bash test.sh
        working-directory: THREE_FRIENDS
        env:
          # 건너뛰기 금지 — playwright 가 없으면 초록불 대신 빨간불이 뜬다
          REQUIRE_BROWSER: '1'
