<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" viewBox="0 0 700 620">
<style>
 .l{fill:none;stroke:#000;stroke-width:2}
 .t{fill:none;stroke:#000;stroke-width:1.3}
 .d{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:7 5}
 .n{font:15px sans-serif;fill:#000}
 .cap{font:bold 20px sans-serif;fill:#000;text-anchor:middle}
 .sm{font:13px sans-serif;fill:#000}
 .ld{stroke:#000;stroke-width:1}
</style>
<rect width="700" height="620" fill="#fff"/>
<text class="cap" x="350" y="36">【도 5】</text>

<!-- lower part of sphere -->
<path class="l" d="M120,120 q110,120 230,120 q120,0 230,-120"/>
<path class="t" d="M140,120 q104,102 210,102 q108,0 212,-102"/>

<!-- bottom seat with contacts 115 -->
<path class="l" d="M282,236 h136 v40 h-136 z"/>
<g class="t">
<rect x="300" y="242" width="14" height="10"/>
<rect x="330" y="242" width="14" height="10"/>
<rect x="360" y="242" width="14" height="10"/>
<rect x="390" y="242" width="14" height="10"/>
</g>
<!-- hall sensor 145 -->
<rect class="l" x="238" y="208" width="34" height="22"/>
<text class="sm" x="243" y="224">145</text>
<!-- ferromagnetic ring in body -->
<rect class="t" x="270" y="228" width="20" height="10"/>
<rect class="t" x="410" y="228" width="20" height="10"/>

<!-- gap -->
<line class="d" x1="350" y1="278" x2="350" y2="322"/>
<text class="sm" x="358" y="304">착탈</text>

<!-- handle top: coupling 220 -->
<path class="l" d="M270,324 h160 v44 h-160 z"/>
<!-- magnets 221 -->
<rect class="t" x="276" y="330" width="26" height="32"/>
<rect class="t" x="398" y="330" width="26" height="32"/>
<path class="t" d="M276,346 h26 M398,346 h26"/>
<!-- pogo pins 222 -->
<g class="t">
<rect x="300" y="316" width="14" height="8"/><path d="M307,316 v-6"/>
<rect x="330" y="316" width="14" height="8"/><path d="M337,316 v-6"/>
<rect x="360" y="316" width="14" height="8"/><path d="M367,316 v-6"/>
<rect x="390" y="316" width="14" height="8"/><path d="M397,316 v-6"/>
</g>
<!-- orientation key -->
<path class="l" d="M430,336 h18 v20 h-18"/>
<path class="t" d="M418,236 h18 v20"/>

<!-- handle body -->
<path class="l" d="M262,368 h176 v190 q0,20 -20,20 h-136 q-20,0 -20,-20 z"/>
<rect class="t" x="286" y="400" width="128" height="140" rx="10"/>
<text class="sm" x="330" y="474">배터리 171</text>
<rect class="t" x="286" y="376" width="128" height="18"/>
<text class="sm" x="316" y="390">172 / 173 / 174</text>
<circle class="l" cx="350" cy="392" r="0"/>

<line class="ld" x1="180" y1="160" x2="90" y2="120"/><text class="n" x="52" y="124">110</text>
<line class="ld" x1="255" y1="208" x2="130" y2="196"/><text class="n" x="92" y="200">145</text>
<line class="ld" x1="418" y1="246" x2="560" y2="212"/><text class="n" x="566" y="216">115</text>
<line class="ld" x1="404" y1="318" x2="560" y2="290"/><text class="n" x="566" y="294">222</text>
<line class="ld" x1="424" y1="346" x2="560" y2="346"/><text class="n" x="566" y="350">221</text>
<line class="ld" x1="448" y1="346" x2="600" y2="400"/><text class="n" x="606" y="404">방향결정형상</text>
<line class="ld" x1="270" y1="344" x2="130" y2="330"/><text class="n" x="92" y="334">220</text>
<line class="ld" x1="262" y1="470" x2="130" y2="470"/><text class="n" x="92" y="474">200</text>
<line class="ld" x1="438" y1="500" x2="560" y2="520"/><text class="n" x="566" y="524">210</text>
</svg>
